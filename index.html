<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- maximum-scale=1 blocks iOS Safari's automatic zoom-in when focusing
         inputs (the chat box "sometimes zooms" bug). iOS still allows manual
         pinch-zoom regardless of this value, so accessibility is preserved. -->
    <!-- interactive-widget=resizes-content: browsers that support it shrink
         the LAYOUT when the keyboard opens (native-app behavior); others
         ignore it and JinniChat's visualViewport handler covers the gap. -->
    <!-- interactive-widget is Android-Chrome-only; Safari logs a console
         error for the unknown key, so the boot script injects it on Android
         instead of shipping it statically (2026-08-23). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
    <title>Jinni - Your AI Guide</title>
    <!-- Pre-paint theme. The JS bundle is large, so the first paint happens
         long before Vue mounts — with no background here the page (and the
         iOS Safari chrome/canvas, which derives its tint from that FIRST
         paint and may keep it until a document scroll or reload) flashed
         WHITE, then cream, then the real theme. This mirrors the settings
         store: jinni_settings.theme, 'auto' = night 21:00–06:00 (timeUtils).
         App.vue takes over with per-page edge colors right after mount. -->
    <!-- Two media-scoped metas (2026-08-22): iPhone's URL bar is at the
         BOTTOM (coarse pointer → page bottom color), desktop Safari's
         toolbar is at the TOP (fine pointer → page top color). One un-scoped
         meta painted the ocean-blue page bottom across the macOS tab bar.
         App.vue (utils/themeColorMeta) keeps both current per page. -->
    <meta name="theme-color" media="(pointer: coarse)" content="#f9f5eb">
    <meta name="theme-color" media="(pointer: fine)" content="#f9f5eb">
    <script>
      (function () {
        var theme = 'auto';
        try { theme = JSON.parse(localStorage.getItem('jinni_settings') || '{}').theme || 'auto'; } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          var h = new Date().getHours();
          theme = (h >= 21 || h < 6) ? 'dark' : 'light';
        }
        var c = theme === 'dark' ? '#0a0118' : '#f9f5eb';
        var d = document.documentElement;
        // data-theme before any CSS applies — App.vue's base CSS keys its
        // html/body background-color on it, so the stylesheet lands already
        // in the right theme (no cream flash for night users).
        d.setAttribute('data-theme', theme);
        d.style.background = c;
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.setAttribute('content', c);
        });
        // interactive-widget=resizes-content: Android-Chrome-only viewport key
        // (keyboard shrinks the layout instead of overlaying it). Injected
        // here so Safari never parses it and never logs the unknown-key error.
        if (/Android/i.test(navigator.userAgent)) {
          var vp = document.querySelector('meta[name="viewport"]');
          if (vp) vp.setAttribute('content', vp.getAttribute('content') + ', interactive-widget=resizes-content');
        }
      })();
    </script>
    <!-- Tight-cropped lamp icons — the raw logo PNG has big transparent
         margins that made the favicon look tiny in browser tabs. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
    <!-- v2 filename busts Safari/Cloudflare caches — the old URL may be
         cached for a long time and kept serving the unbalanced icon. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png">
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
