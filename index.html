<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- maximum-scale=1 blocks iOS Safari's automatic zoom-in when focusing
         inputs (the chat box "sometimes zooms" bug). iOS still allows manual
         pinch-zoom regardless of this value, so accessibility is preserved. -->
    <!-- interactive-widget=resizes-content: browsers that support it shrink
         the LAYOUT when the keyboard opens (native-app behavior); others
         ignore it and JinniChat's visualViewport handler covers the gap. -->
    <!-- interactive-widget is Android-Chrome-only; Safari logs a console
         error for the unknown key, so the boot script injects it on Android
         instead of shipping it statically (2026-08-23). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
    <title>Jinni - Your AI Guide</title>
    <meta name="description" content="Ask Jinni where to go — restaurants, events, hidden gems in Yerevan and beyond. Real verified places, instant answers.">
    <!-- Open Graph / Twitter cards: what Facebook, Instagram, TikTok, Telegram
         and WhatsApp render when a jinni.travel link is shared. Crawlers fetch
         this raw HTML and never run Vue, so the tags must live HERE, static,
         with ABSOLUTE image URLs. og-image.jpg is 1200x630 (the standard
         large-card size), kept under ~300KB (WhatsApp skips big images). -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Jinni">
    <meta property="og:title" content="Jinni — Your AI Guide">
    <meta property="og:description" content="Ask Jinni where to go — restaurants, events, hidden gems in Yerevan and beyond. Real verified places, instant answers.">
    <meta property="og:url" content="https://jinni.travel/">
    <meta property="og:image" content="https://jinni.travel/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:alt" content="Jinni — your journey starts here. A golden genie lamp with magic smoke.">
    <meta property="og:locale" content="en_US">
    <meta property="og:locale:alternate" content="hy_AM">
    <meta property="og:locale:alternate" content="ru_RU">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Jinni — Your AI Guide">
    <meta name="twitter:description" content="Ask Jinni where to go — restaurants, events, hidden gems in Yerevan and beyond. Real verified places, instant answers.">
    <meta name="twitter:image" content="https://jinni.travel/og-image.jpg">
    <!-- Armenian text (event names, venues, ticket prices) had no font of its
         own: the app stack is Latin-only, so each Armenian character was
         substituted separately by the OS and bold was synthesised. One real
         family with real weights fixes both. Latin is untouched — it resolves
         earlier in the stack. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@300..700&display=swap">
    <!-- Pre-paint theme. The JS bundle is large, so the first paint happens
         long before Vue mounts — with no background here the page (and the
         iOS Safari chrome/canvas, which derives its tint from that FIRST
         paint and may keep it until a document scroll or reload) flashed
         WHITE, then cream, then the real theme. This mirrors the settings
         store: jinni_settings.theme, 'auto' = night 21:00–06:00 (timeUtils).
         App.vue takes over with per-page edge colors right after mount. -->
    <!-- Two media-scoped metas (2026-08-22): iPhone's URL bar is at the
         BOTTOM (coarse pointer → page bottom color), desktop Safari's
         toolbar is at the TOP (fine pointer → page top color). One un-scoped
         meta painted the ocean-blue page bottom across the macOS tab bar.
         App.vue (utils/themeColorMeta) keeps both current per page. -->
    <meta name="theme-color" media="(pointer: coarse)" content="#f9f5eb">
    <meta name="theme-color" media="(pointer: fine)" content="#f9f5eb">
    <script>
      (function () {
        var theme = 'auto';
        try { theme = JSON.parse(localStorage.getItem('jinni_settings') || '{}').theme || 'auto'; } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          var h = new Date().getHours();
          theme = (h >= 21 || h < 6) ? 'dark' : 'light';
        }
        var c = theme === 'dark' ? '#0a0118' : '#f9f5eb';
        var d = document.documentElement;
        // data-theme before any CSS applies — App.vue's base CSS keys its
        // html/body background-color on it, so the stylesheet lands already
        // in the right theme (no cream flash for night users).
        d.setAttribute('data-theme', theme);
        d.style.background = c;
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.setAttribute('content', c);
        });
        // interactive-widget=resizes-content: Android-Chrome-only viewport key
        // (keyboard shrinks the layout instead of overlaying it). Injected
        // here so Safari never parses it and never logs the unknown-key error.
        if (/Android/i.test(navigator.userAgent)) {
          var vp = document.querySelector('meta[name="viewport"]');
          if (vp) vp.setAttribute('content', vp.getAttribute('content') + ', interactive-widget=resizes-content');
        }
      })();
    </script>
    <!-- Glowing-lamp icon set (v3, 2026-08-29, from new_bottle.png): lamp on
         BLACK — the glow needs the dark ground, and iOS renders transparent
         app-icon pixels black anyway. -->
    <!-- Standard filenames (Arsen 2026-08-29; previous set parked in
         /old-icons). ?v=3 query busts Safari/Cloudflare caches — an old URL
         may be cached for a long time and keep serving the previous icon. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png?v=3">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
